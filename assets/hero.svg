<svg width="1000" height="280" viewBox="0 0 1000 280" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Marcel Slowikowski profile banner</title>
  <desc id="desc">Animated dark profile banner for Marcel Slowikowski, founder and AI systems builder.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1000" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070808"/>
      <stop offset="0.55" stop-color="#0A0B0B"/>
      <stop offset="1" stop-color="#111810"/>
    </linearGradient>
    <linearGradient id="accent" x1="180" y1="40" x2="820" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B8E7FF"/>
      <stop offset="0.55" stop-color="#C9FF72"/>
      <stop offset="1" stop-color="#7AB844"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(770 90) rotate(145) scale(330 210)">
      <stop stop-color="#C9FF72" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#C9FF72" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <clipPath id="clip">
      <rect x="0" y="0" width="1000" height="280" rx="22"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1000" height="280" rx="22" fill="url(#bg)"/>
    <rect width="1000" height="280" fill="url(#grid)"/>
    <rect width="1000" height="280" fill="url(#glow)"/>

    <g opacity="0.6">
      <circle cx="820" cy="96" r="66" stroke="#C9FF72" stroke-opacity="0.22"/>
      <circle cx="820" cy="96" r="92" stroke="#B8E7FF" stroke-opacity="0.09" stroke-dasharray="4 10">
        <animateTransform attributeName="transform" type="rotate" from="0 820 96" to="360 820 96" dur="18s" repeatCount="indefinite"/>
      </circle>
      <circle cx="820" cy="96" r="118" stroke="#C9FF72" stroke-opacity="0.08" stroke-dasharray="2 14">
        <animateTransform attributeName="transform" type="rotate" from="360 820 96" to="0 820 96" dur="26s" repeatCount="indefinite"/>
      </circle>
      <circle r="5" fill="#C9FF72" filter="url(#softGlow)">
        <animateMotion dur="7s" repeatCount="indefinite" path="M754 96 A66 66 0 1 1 886 96 A66 66 0 1 1 754 96"/>
      </circle>
    </g>

    <g opacity="0.28">
      <path d="M620 218C700 164 759 191 820 144C865 110 905 62 1007 72" stroke="url(#accent)" stroke-width="1.5" stroke-dasharray="8 12">
        <animate attributeName="stroke-dashoffset" values="0;-80" dur="6s" repeatCount="indefinite"/>
      </path>
      <path d="M550 238C664 181 726 242 814 198C893 158 922 119 1022 134" stroke="#B8E7FF" stroke-opacity="0.45" stroke-width="1" stroke-dasharray="3 11">
        <animate attributeName="stroke-dashoffset" values="0;56" dur="8s" repeatCount="indefinite"/>
      </path>
    </g>

    <rect x="54" y="45" width="10" height="10" rx="2" fill="#C9FF72">
      <animate attributeName="opacity" values="1;0.25;1" dur="2.4s" repeatCount="indefinite"/>
    </rect>
    <text x="76" y="55" fill="#C9FF72" font-family="JetBrains Mono, Consolas, monospace" font-size="14" letter-spacing="2">SYSTEM ONLINE</text>

    <text x="54" y="124" fill="#F6F8F4" font-family="Inter, Arial, sans-serif" font-size="48" font-weight="750" letter-spacing="-1.4">MARCEL SLOWIKOWSKI</text>
    <rect x="54" y="145" width="520" height="2" rx="1" fill="url(#accent)">
      <animate attributeName="width" values="0;520;520" keyTimes="0;0.55;1" dur="2.2s" fill="freeze"/>
    </rect>
    <text x="54" y="182" fill="#B8E7FF" font-family="JetBrains Mono, Consolas, monospace" font-size="17" letter-spacing="1.2">FOUNDER / AI SYSTEMS / SOFTWARE</text>
    <text x="54" y="224" fill="#C9FF72" font-family="JetBrains Mono, Consolas, monospace" font-size="15">Democratizing AI, one late night at a time.</text>

    <g opacity="0.8">
      <circle cx="55" cy="251" r="2.5" fill="#C9FF72"/>
      <circle cx="68" cy="251" r="2.5" fill="#B8E7FF"/>
      <circle cx="81" cy="251" r="2.5" fill="#FFFFFF" fill-opacity="0.38"/>
      <path d="M100 251H310" stroke="#FFFFFF" stroke-opacity="0.12"/>
      <rect x="100" y="247" width="36" height="8" rx="4" fill="#C9FF72" fill-opacity="0.45">
        <animate attributeName="x" values="100;274;100" dur="5.5s" repeatCount="indefinite"/>
      </rect>
    </g>

    <rect x="0" y="0" width="1000" height="2" fill="url(#accent)" opacity="0.85"/>
    <rect x="0" y="278" width="1000" height="2" fill="url(#accent)" opacity="0.25"/>

    <rect x="0" y="-36" width="1000" height="36" fill="#C9FF72" opacity="0.035">
      <animate attributeName="y" values="-36;280" dur="7s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
