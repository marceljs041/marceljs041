name: Generate contribution snake

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate SVG animations
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23C9FF72&color_dots=%23EBEDF0,%23D7F9A8,%23B8E77E,%2397CE58,%236FA636
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23C9FF72&color_dots=%23161B22,%2333402B,%23566B3F,%237D9C53,%23C9FF72

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
